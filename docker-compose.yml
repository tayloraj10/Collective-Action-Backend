version: "3.9"

services:
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      # In Docker, the database service is reachable as "db"; .env uses localhost for local migrations.
      POSTGRES_HOST: db
      POSTGRES_PORT: ${POSTGRES_PORT}
      # Use "development" or "testing" so GCS photos go under dev/ or testing/ for easy cleanup
      ENVIRONMENT: ${ENVIRONMENT:-development}
      GCS_USER_IMAGES_BUCKET: ${GCS_USER_IMAGES_BUCKET}
      GCS_SUBMISSIONS_BUCKET: ${GCS_SUBMISSIONS_BUCKET}
      GCS_PROJECT_ID: ${GCS_PROJECT_ID}
      # Only set GOOGLE_APPLICATION_CREDENTIALS if defined in .env
      GOOGLE_APPLICATION_CREDENTIALS: ${GOOGLE_APPLICATION_CREDENTIALS:-}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./app:/app/app
      # Only mount creds if the file exists
      - ./creds:/app/creds:ro

volumes:
  postgres_data:
